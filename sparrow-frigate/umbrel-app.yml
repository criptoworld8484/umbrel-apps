manifestVersion: 1.1.0
id: sparrow-frigate
category: bitcoin
name: Frigate (Silent Payments)
version: "1.6.0"
tagline: Electrum server for Silent Payments (BIP352)
icon: https://raw.githubusercontent.com/criptoworld8484/umbrel-apps/master/sparrow-frigate/icon.png
description: >-
  Frigate indexa y escanea Silent Payments en el servidor (BIP352).
  Se adapta a la red de Bitcoin Core: mainnet, signet o testnet4.

  Requisitos: Bitcoin con txindex=1, ZMQ sequence y Electrs en la misma red.
  Sparrow: conecta a Frigate en puerto 57001 (no a Electrs en 50001).
developer: Sparrow Wallet
website: https://github.com/sparrowwallet/frigate
dependencies:
  - bitcoin
  - electrs
repo: https://github.com/sparrowwallet/frigate
support: https://github.com/criptoworld8484/frigate-umbrel/issues
port: 3006
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Multi-red: detecta mainnet, signet o testnet4 desde Bitcoin Core de Umbrel.
submitter: criptoworld8484
submission: https://github.com/criptoworld8484/umbrel-apps
backupIgnore:
  - data/mainnet/db
  - data/signet/db
  - data/testnet/db
  - data/testnet4/db
