manifestVersion: 1.1.0
id: sparrow-frigate
category: bitcoin
name: Frigate (Silent Payments)
version: "1.5.8"
tagline: Electrum server for Silent Payments (BIP352) on Signet
icon: https://raw.githubusercontent.com/criptoworld8484/umbrel-apps/master/sparrow-frigate/icon.png
description: >-
  Frigate indexa y escanea Silent Payments en el servidor (BIP352). Para
  Signet: Bitcoin Core con txindex=1 y Electrs instalados.

  Sparrow: conecta a Frigate en puerto 50002 (no a Electrs en 50001).
  Electrs sigue en 50001 como backend interno de Frigate.
developer: Sparrow Wallet
website: https://github.com/sparrowwallet/frigate
dependencies:
  - bitcoin
  - electrs
repo: https://github.com/sparrowwallet/frigate
support: https://github.com/criptoworld8484/frigate-umbrel/issues
port: 3006
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Aclara puertos: Electrs 50001 (backend), Frigate/Sparrow 50002. Sin cambio de imagen.
submitter: criptoworld8484
submission: https://github.com/criptoworld8484/umbrel-apps
backupIgnore:
  - data/signet/db
