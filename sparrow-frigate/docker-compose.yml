version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: sparrow-frigate_web_1
      APP_PORT: 3006

  init:
    image: alpine:3.20
    user: "0:0"
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/web:/web
    environment:
      APP_BITCOIN_NETWORK: "${APP_BITCOIN_NETWORK}"
    command:
      - sh
      - -c
      - |
        NET="${APP_BITCOIN_NETWORK:-mainnet}"
        mkdir -p "/data/${NET}/db" /web/public
        chown -R 1000:1000 /data /web
        chmod 755 /data

  web:
    image: node:20-alpine
    restart: on-failure
    user: "1000:1000"
    working_dir: /app
    command: ["node", "server.js"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - ${APP_DATA_DIR}/web:/app:ro
    environment:
      PORT: "3006"
      DEVICE_DOMAIN_NAME: "${DEVICE_DOMAIN_NAME}"
      ELECTRUM_PORT: "${APP_SPARROW_FRIGATE_ELECTRUM_PORT}"
      ELECTRUM_LOCAL_SERVICE: "${DEVICE_DOMAIN_NAME}"
      ELECTRUM_HIDDEN_SERVICE: "${APP_SPARROW_FRIGATE_RPC_HIDDEN_SERVICE}"
      FRIGATE_STATUS_HOST: "${APP_SPARROW_FRIGATE_NODE_IP}"
      FRIGATE_NETWORK: "${APP_BITCOIN_NETWORK}"
      APP_BITCOIN_NETWORK: "${APP_BITCOIN_NETWORK}"
      APP_VERSION: "${APP_VERSION}"

  frigate:
    image: ghcr.io/criptoworld8484/frigate-umbrel-web:frigate-1.5.7
    restart: on-failure
    stop_grace_period: 5m
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/app-entrypoint/entrypoint.sh"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      FRIGATE_NETWORK: "${APP_BITCOIN_NETWORK}"
      FRIGATE_CACHE_SIZE: "2M"
      FRIGATE_MEMORY_LIMIT: "4GB"
      APP_FRIGATE_ELECTRUM_PORT: "${APP_SPARROW_FRIGATE_ELECTRUM_PORT}"
      APP_BITCOIN_NODE_IP: "${APP_BITCOIN_NODE_IP}"
      APP_BITCOIN_RPC_PORT: "${APP_BITCOIN_RPC_PORT}"
      APP_BITCOIN_RPC_USER: "${APP_BITCOIN_RPC_USER}"
      APP_BITCOIN_RPC_PASS: "${APP_BITCOIN_RPC_PASS}"
      APP_BITCOIN_ZMQ_SEQUENCE_PORT: "${APP_BITCOIN_ZMQ_SEQUENCE_PORT}"
      APP_BITCOIN_NETWORK: "${APP_BITCOIN_NETWORK}"
      APP_ELECTRS_NODE_IP: "${APP_ELECTRS_NODE_IP}"
      APP_ELECTRS_NODE_PORT: "${APP_ELECTRS_NODE_PORT}"
      FRIGATE_BITCOIN_DATA_DIR: "/bitcoin"
    volumes:
      - "${APP_DATA_DIR}/data:/data"
      - "${APP_DATA_DIR}/entrypoint.sh:/app-entrypoint/entrypoint.sh:ro"
      - "${APP_BITCOIN_DATA_DIR}:/bitcoin:ro"
    ports:
      - "${APP_SPARROW_FRIGATE_ELECTRUM_PORT}:${APP_SPARROW_FRIGATE_ELECTRUM_PORT}"
    networks:
      default:
        ipv4_address: ${APP_SPARROW_FRIGATE_NODE_IP}

  tor:
    image: getumbrel/tor:0.4.7.8@sha256:2ace83f22501f58857fa9b403009f595137fa2e7986c4fda79d82a8119072b6a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
