version: "3.7"

services:
  app_proxy:
    environment:
      # Nombre fijado por umbrelOS en patchComposeFile: <app-id>_<service>_1
      APP_HOST: sparrow-frigate_web_1
      APP_PORT: 3006

  init:
    image: alpine:3.20
    user: "0:0"
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    command:
      - sh
      - -c
      - |
        mkdir -p /data/signet/db
        chown -R 1000:1000 /data
        chmod 755 /data

  web:
    image: ghcr.io/criptoworld8484/frigate-umbrel-web:1.5.3
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      default:

  frigate:
    image: ghcr.io/criptoworld8484/frigate-umbrel:1.5.3
    restart: on-failure
    stop_grace_period: 5m
    user: "1000:1000"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      FRIGATE_NETWORK: "signet"
      FRIGATE_CACHE_SIZE: "2M"
      FRIGATE_MEMORY_LIMIT: "4GB"
      APP_FRIGATE_ELECTRUM_PORT: "50002"
      APP_BITCOIN_NODE_IP: "${APP_BITCOIN_NODE_IP}"
      APP_BITCOIN_RPC_PORT: "${APP_BITCOIN_RPC_PORT}"
      APP_BITCOIN_RPC_USER: "${APP_BITCOIN_RPC_USER}"
      APP_BITCOIN_RPC_PASS: "${APP_BITCOIN_RPC_PASS}"
      APP_BITCOIN_ZMQ_SEQUENCE_PORT: "${APP_BITCOIN_ZMQ_SEQUENCE_PORT}"
      APP_BITCOIN_NETWORK: "${APP_BITCOIN_NETWORK}"
      APP_ELECTRS_NODE_IP: "${APP_ELECTRS_NODE_IP}"
      APP_ELECTRS_NODE_PORT: "${APP_ELECTRS_NODE_PORT}"
      FRIGATE_BITCOIN_DATA_DIR: "/bitcoin"
    volumes:
      - "${APP_DATA_DIR}/data:/data"
      - "${APP_BITCOIN_DATA_DIR}:/bitcoin:ro"
    ports:
      - "50002:50002"
    networks:
      default:
