<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frigate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "media",
      theme: {
        extend: {
          colors: { umbrel: "#5351FB" },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/vendor/qrcode.js"></script>
</head>
<body class="min-h-full bg-slate-100 dark:bg-neutral-800 w-full text-neutral-900 dark:text-neutral-100">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="py-14">
      <!-- Header -->
      <div class="flex justify-content-start align-items-center">
        <div class="mr-6 flex items-center justify-center">
          <img class="rounded-3xl w-32 h-32 shadow-lg" src="/icon.png" alt="Frigate">
        </div>
        <div>
          <div class="flex items-center">
            <svg width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle id="status-dot" cx="4" cy="4" r="4" fill="#94a3b8"/>
            </svg>
            <p id="status-text" class="ml-1 text-lg text-gray-500">Starting</p>
          </div>
          <h3 class="text-5xl font-semibold dark:text-white">Frigate</h3>
          <div class="mt-2">
            <span id="version-text" class="text-gray-500 font-medium">...</span>
          </div>
        </div>
      </div>

      <!-- Sync -->
      <div class="flex justify-end mb-2">
        <h3 id="sync-label" class="font-semibold mb-0 text-gray-800 dark:text-gray-200 animate-pulse">
          Connecting to Frigate server...
        </h3>
      </div>
      <div class="w-full bg-gray-200 dark:bg-neutral-700 h-2 relative overflow-hidden rounded-full">
        <div id="sync-bar" class="h-full progressbar rounded-full bg-green-400" role="progressbar" style="width: 0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
      </div>

      <!-- Connection (Electrs layout) -->
      <div class="mt-16">
        <p class="mb-8 text-neutral-900 dark:text-neutral-300 text-lg">
          Use the following details to connect your wallet or application to Frigate.
        </p>
        <div class="flex flex-col md:grid md:grid-cols-12 md:gap-8">
          <div class="flex justify-center mt-8 md:mt-0 sm:text-center md:max-w-2xl md:mx-auto md:col-span-4 md:text-left md:items-center">
            <div class="max-w-fit p-4 bg-white rounded-lg shadow">
              <div class="relative" id="qr-container">
                <div id="qr-svg-holder" class="qr-image mx-auto min-w-[220px] min-h-[220px] flex items-center justify-center"></div>
                <div id="qr-logo" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center pointer-events-none hidden">
                  <div class="bg-white w-24 h-24 rounded-2xl z-10 flex items-center justify-center">
                    <img src="/icon.png" class="p-4 w-full h-full object-contain" alt="">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="mt-4 md:col-span-8">
            <div class="flex flex-col space-y-4 items-center md:items-start">
              <div class="max-w-xs w-full">
                <div class="rounded-full p-1 bg-slate-200 dark:bg-zinc-700">
                  <div class="relative z-0 rounded-full">
                    <button type="button" id="btn-local" class="rounded-full px-4 py-2 w-1/2 font-medium dark:text-white transition whitespace-nowrap text-white duration-500">
                      Local Network
                    </button>
                    <button type="button" id="btn-tor" class="rounded-full px-4 py-2 w-1/2 font-medium dark:text-white transition text-slate-800">
                      Tor
                    </button>
                    <span id="toggle-pill" class="transform transition duration-500 ease-in-out absolute top-0 left-0 h-10 w-1/2 bg-umbrel rounded-full shadow-md" style="z-index: -1"></span>
                  </div>
                </div>
              </div>

              <div class="w-full">
                <label class="mb-1 d-block text-sm font-bold uppercase dark:text-slate-300">Address</label>
                <div id="field-address-wrap" class="input-copy-wrap hidden">
                  <div class="flex items-center justify-between w-full border-2 border-dashed border-gray-200 dark:border-gray-600 py-2 px-4 font-mono mt-1 bg-white dark:bg-neutral-900 dark:text-white">
                    <input id="field-address" type="text" class="bg-transparent outline-none -mr-2 w-full" readonly>
                    <span class="copy-icon-btn" data-copy="address" title="Copy">
                      <svg width="18" height="18" viewBox="0 0 18 18" class="copy-icon" fill="none" xmlns="http://www.w3.org/2000/svg"><path class="copy-path" d="M10.9336 18H4.21875C2.66789 18 1.40625 16.7384 1.40625 15.1875V5.66016C1.40625 4.1093 2.66789 2.84766 4.21875 2.84766H10.9336C12.4845 2.84766 13.7461 4.1093 13.7461 5.66016V15.1875C13.7461 16.7384 12.4845 18 10.9336 18ZM4.21875 4.25391C3.44339 4.25391 2.8125 4.8848 2.8125 5.66016V15.1875C2.8125 15.9629 3.44339 16.5938 4.21875 16.5938H10.9336C11.709 16.5938 12.3398 15.9629 12.3398 15.1875V5.66016C12.3398 4.8848 11.709 4.25391 10.9336 4.25391H4.21875ZM16.5586 13.4297V2.8125C16.5586 1.26164 15.297 0 13.7461 0H5.94141C5.55304 0 5.23828 0.314758 5.23828 0.703125C5.23828 1.09149 5.55304 1.40625 5.94141 1.40625H13.7461C14.5215 1.40625 15.1523 2.03714 15.1523 2.8125V13.4297C15.1523 13.8181 15.4671 14.1328 15.8555 14.1328C16.2438 14.1328 16.5586 13.8181 16.5586 13.4297Z" fill="#C3C6D1"/></svg>
                    </span>
                  </div>
                </div>
                <span id="placeholder-address" class="loading-placeholder loading-placeholder-lg mt-1" style="width: 100%;"></span>
              </div>

              <div class="mt-6 grid grid-cols-1 gap-y-6 gap-x-4 md:grid-cols-6 w-full">
                <div class="flex flex-col md:col-span-3">
                  <label class="mb-1 d-block text-sm font-bold uppercase dark:text-slate-300">Port</label>
                  <div id="field-port-wrap" class="input-copy-wrap hidden">
                    <div class="flex items-center justify-between w-full border-2 border-dashed border-gray-200 dark:border-gray-600 py-2 px-4 font-mono mt-1 bg-white dark:bg-neutral-900 dark:text-white">
                      <input id="field-port" type="text" class="bg-transparent outline-none -mr-2 w-full" readonly>
                      <span class="copy-icon-btn" data-copy="port" title="Copy">
                        <svg width="18" height="18" viewBox="0 0 18 18" class="copy-icon" fill="none" xmlns="http://www.w3.org/2000/svg"><path class="copy-path" d="M10.9336 18H4.21875C2.66789 18 1.40625 16.7384 1.40625 15.1875V5.66016C1.40625 4.1093 2.66789 2.84766 4.21875 2.84766H10.9336C12.4845 2.84766 13.7461 4.1093 13.7461 5.66016V15.1875C13.7461 16.7384 12.4845 18 10.9336 18ZM4.21875 4.25391C3.44339 4.25391 2.8125 4.8848 2.8125 5.66016V15.1875C2.8125 15.9629 3.44339 16.5938 4.21875 16.5938H10.9336C11.709 16.5938 12.3398 15.9629 12.3398 15.1875V5.66016C12.3398 4.8848 11.709 4.25391 10.9336 4.25391H4.21875ZM16.5586 13.4297V2.8125C16.5586 1.26164 15.297 0 13.7461 0H5.94141C5.55304 0 5.23828 0.314758 5.23828 0.703125C5.23828 1.09149 5.55304 1.40625 5.94141 1.40625H13.7461C14.5215 1.40625 15.1523 2.03714 15.1523 2.8125V13.4297C15.1523 13.8181 15.4671 14.1328 15.8555 14.1328C16.2438 14.1328 16.5586 13.8181 16.5586 13.4297Z" fill="#C3C6D1"/></svg>
                      </span>
                    </div>
                  </div>
                  <span id="placeholder-port" class="loading-placeholder loading-placeholder-lg mt-1" style="width: 100%;"></span>
                </div>
                <div class="flex flex-col md:col-span-3">
                  <label class="mb-1 d-block text-sm font-bold uppercase dark:text-slate-300">SSL</label>
                  <div id="field-ssl-wrap" class="input-copy-wrap hidden">
                    <div class="flex items-center justify-between w-full border-2 border-dashed border-gray-200 dark:border-gray-600 py-2 px-4 font-mono mt-1 bg-white dark:bg-neutral-900 dark:text-white">
                      <input id="field-ssl" type="text" class="bg-transparent outline-none -mr-2 w-full" readonly value="Disabled">
                      <span class="copy-icon-btn" data-copy="ssl" title="Copy">
                        <svg width="18" height="18" viewBox="0 0 18 18" class="copy-icon" fill="none" xmlns="http://www.w3.org/2000/svg"><path class="copy-path" d="M10.9336 18H4.21875C2.66789 18 1.40625 16.7384 1.40625 15.1875V5.66016C1.40625 4.1093 2.66789 2.84766 4.21875 2.84766H10.9336C12.4845 2.84766 13.7461 4.1093 13.7461 5.66016V15.1875C13.7461 16.7384 12.4845 18 10.9336 18ZM4.21875 4.25391C3.44339 4.25391 2.8125 4.8848 2.8125 5.66016V15.1875C2.8125 15.9629 3.44339 16.5938 4.21875 16.5938H10.9336C11.709 16.5938 12.3398 15.9629 12.3398 15.1875V5.66016C12.3398 4.8848 11.709 4.25391 10.9336 4.25391H4.21875ZM16.5586 13.4297V2.8125C16.5586 1.26164 15.297 0 13.7461 0H5.94141C5.55304 0 5.23828 0.314758 5.23828 0.703125C5.23828 1.09149 5.55304 1.40625 5.94141 1.40625H13.7461C14.5215 1.40625 15.1523 2.03714 15.1523 2.8125V13.4297C15.1523 13.8181 15.4671 14.1328 15.8555 14.1328C16.2438 14.1328 16.5586 13.8181 16.5586 13.4297Z" fill="#C3C6D1"/></svg>
                      </span>
                    </div>
                  </div>
                  <span id="placeholder-ssl" class="loading-placeholder loading-placeholder-lg mt-1" style="width: 100%;"></span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-12 border-t border-gray-300 space-x-6 flex whitespace-nowrap dark:border-slate-200 dark:border-opacity-20">
          <p class="mt-12 text-neutral-900 dark:text-neutral-300 text-lg whitespace-normal">
            Looking for step-by-step instructions to connect your wallet to Frigate?
            <a class="underline" href="https://github.com/sparrowwallet/frigate" target="_blank" rel="noopener">Click here</a>.
          </p>
        </div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
