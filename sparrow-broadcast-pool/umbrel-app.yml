manifestVersion: 1
id: sparrow-broadcast-pool
category: bitcoin
name: Broadcast Pool
version: "0.3.23"
tagline: Programa y difunde transacciones Bitcoin desde Sparrow con privacidad
icon: https://raw.githubusercontent.com/criptoworld8484/umbrel-apps/master/sparrow-broadcast-pool/icon.png
description: >-
  Broadcast Pool retiene transacciones firmadas en Sparrow Wallet y las difunde
  a la red en el momento que elijas: inmediato, por fecha/hora o por altura de
  bloque.


  Incluye un servidor Electrum integrado para que Sparrow se conecte a tu nodo
  Umbrel sin usar indexadores externos. Las transacciones permanecen en un
  mempool virtual local hasta que el scheduler las emite.


  Características:

  - Modos de envío: inmediato, programado (reloj) y por bloque

  - Reprogramación si el MTP de cadena retrasa la emisión

  - Dashboard web para monitorizar el pool

  - Soporte mainnet, testnet4 y signet (según red del nodo Bitcoin)

  - Conexión automática a Bitcoin Core y Electrs de Umbrel


  Configura Sparrow con la URL Electrum que muestra el dashboard (puerto 50050).
releaseNotes: >-
  v0.3.23 — Las transacciones inmediatas ahora se etiquetan correctamente como "inmediata" en lugar de "por bloque": un nLockTime de anti-fee-sniping ya cumplido (≤ el bloque actual) se trata como inmediata, mientras que los bloqueos de altura futura reales siguen como por bloque. Reescrita la diapositiva de Liana en la Guía Rápida como un tutorial paso a paso del ciclado de UTXOs. Añadido un pie de página discreto con autor, año y versión de la app.

  v0.3.22 — Corrige un mensaje de error falso ("Error saving") que aparecía al guardar los ajustes; la configuración se guardaba correctamente, solo era un aviso erróneo de la interfaz.

  v0.3.21 — Cifrado en reposo de los datos sensibles del pool (tx firmadas, direcciones) con detección de manipulación: si se altera una fila de la base de datos, se activa un "modo seguro" que detiene la difusión hasta que lo revises. Nuevo archivo histórico cifrado con contraseña propia: las transacciones terminadas se pueden volcar manualmente ("Archivar ahora") o automáticamente a los 30 días, y solo se consultan introduciendo la contraseña. La contraseña RPC de Bitcoin Core también se guarda cifrada. Además, el valor del pool se muestra ahora en sats.

  v0.3.20 — Las transacciones importadas ahora se muestran como un tipo "Importada" diferenciado en el dashboard y pueden programarse por fecha/hora o por precio, igual que las manuales. Se elimina el indexador externo/secundario de la interfaz y la configuración; el indexador principal y la copia de seguridad de Bitcoin Core se mantienen.

  v0.3.19 — Tercer nivel de resiliencia y ciclado de UTXO de Liana. Si el indexador principal Y Bitcoin Core fallan, las programaciones pueden seguir cumpliéndose con un indexador secundario configurable en tu red. Nueva opción de "bloque virtual" para el ciclado de UTXO de Liana (altura de bloque virtual configurable). Dashboard: tabla de transacciones con el origen (Sparrow/Liana) coloreado, columna TXID unificada (enlace + copiar), toggle deslizante y favicon.

  v0.3.18 — Las transacciones programadas se siguen difundiendo aunque el indexador (electrs/Fulcrum) se caiga.

  El scheduler lee ahora la altura de bloque y el tiempo mediano (MTP) directamente de Bitcoin Core cuando el indexador no responde, en lugar de quedarse parado. El dashboard indica qué indexador está caído, en qué IP:puerto, y si las programaciones siguen en marcha o están en pausa.

  v0.3.2 — Fix Sparrow connect hang (accept thread + no sync I/O on tokio workers).

  Dedicated OS thread for TCP accept; broadcast ingest fully async; removed sync electrs enrich on worker threads

  v0.3.1 — pre-ingest ack + session get_history fallback at height 0
