manifestVersion: 1
id: sparrow-broadcast-pool
category: bitcoin
name: Broadcast Pool
version: "0.3.18"
tagline: Programa y difunde transacciones Bitcoin desde Sparrow con privacidad
icon: https://raw.githubusercontent.com/criptoworld8484/umbrel-apps/master/sparrow-broadcast-pool/icon.png
description: >-
  Broadcast Pool retiene transacciones firmadas en Sparrow Wallet y las difunde
  a la red en el momento que elijas: inmediato, por fecha/hora o por altura de
  bloque.


  Incluye un servidor Electrum integrado para que Sparrow se conecte a tu nodo
  Umbrel sin usar indexadores externos. Las transacciones permanecen en un
  mempool virtual local hasta que el scheduler las emite.


  Características:

  - Modos de envío: inmediato, programado (reloj) y por bloque

  - Reprogramación si el MTP de cadena retrasa la emisión

  - Dashboard web para monitorizar el pool

  - Soporte mainnet, testnet4 y signet (según red del nodo Bitcoin)

  - Conexión automática a Bitcoin Core y Electrs de Umbrel


  Configura Sparrow con la URL Electrum que muestra el dashboard (puerto 50050).
releaseNotes: >-
  v0.3.18 — Las transacciones programadas se siguen difundiendo aunque el indexador
  (electrs/Fulcrum) se caiga: el scheduler lee la altura de bloque y el tiempo mediano (MTP)
  directamente de Bitcoin Core cuando el indexador no responde, en lugar de quedarse parado.
  El dashboard indica qué indexador está caído, en qué IP:puerto, y si las programaciones
  siguen en marcha o están en pausa.

  v0.3.16 — Detección de red robusta: reintenta hasta que el RPC de Bitcoin Core esté
  listo (en mainnet el arranque tarda más), evitando que el panel muestre testnet4 por error.

  v0.3.15 — Conexión a indexador por hostname (electrs/Fulcrum), genesis real del nodo,
  URL de wallet correcta, y detección de Liana en el mismo puerto que Sparrow para
  programar sus tx por fecha/hora. Incluye los fixes previos del cuelgue de Sparrow.

  v0.3.11 — Fix: Liana fallaba con "Genesis hash mismatch" al configurar. Ahora se
  reporta el genesis real del nodo (soporta signets personalizados).

  v0.3.10 — Importacion respeta la red configurada (no fija signet) y aviso de
  seguridad al arrancar en mainnet (las tx retenidas no se difunden hasta el trigger).

  v0.3.9 — Fix: Sparrow se quedaba en "broadcasting" porque la tx pendiente se
  inyectaba en todas las direcciones consultadas. Ahora se inyecta solo en las
  direcciones reales de la tx (inputs/outputs).

  v0.3.8 — Fix: Sparrow quedaba en "broadcasting" infinito aunque la tx ya estaba en
  la mempool virtual. Ahora se notifican las direcciones de gasto (input) tras resolverlas.

  v0.3.7 — Fix crítico: un deadlock al guardar configuración congelaba el runtime
  y dejaba a Sparrow en "broadcasting" infinito. Se libera el lock de config antes de reconectar.

  v0.3.6 — Fix: en Umbrel, los broadcasts de Sparrow a veces no llegaban al pool.
  El servidor Electrum descartaba las peticiones RPC anteriores al broadcast cuando
  docker-proxy las agrupaba en una sola lectura TCP; ahora se conservan y responden todas.

  v0.3.2 — Fix Sparrow connect hang (accept thread + no sync I/O on tokio workers).

  Dedicated OS thread for TCP accept; broadcast ingest fully async; removed sync electrs enrich on worker threads

  v0.3.1 — pre-ingest ack + session get_history fallback at height 0
