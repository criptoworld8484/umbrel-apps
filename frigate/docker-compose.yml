version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: frigate-silent-payments_frigate_1
      APP_PORT: 3005
      PROXY_AUTH_ADD: "false"

  frigate:
    image: ghcr.io/criptoworld8484/frigate-umbrel/frigate-umbrel:latest@sha256:af2fcae1761c4b3a031c0f33aaa1f11653e39e577ec1c1b87f58329ee926d1b1
    init: true
    restart: on-failure
    stop_grace_period: 5m
    ports:
      - "50001:50001"
      - "50002:50002"
    volumes:
      - "${APP_DATA_DIR}/data/frigate:/data"
    environment:
      FRIGATE_HOME: /data
      FRIGATE_NETWORK: testnet4
    networks:
      default:
        ipv4_address: $APP_FRIGATE_IP

  tor:
    image: getumbrel/tor:0.4.7.8@sha256:2ace83f22501f58857fa9b403009f595137fa2e7986c4fda79d82a8119072b6a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"

networks:
  default:
    ipv4_address: $APP_FRIGATE_IP