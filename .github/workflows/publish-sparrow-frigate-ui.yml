name: Publish sparrow-frigate UI image

on:
  push:
    paths:
      - "sparrow-frigate/web/**"
      - "sparrow-frigate/Dockerfile.ui"
      - "sparrow-frigate/docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./sparrow-frigate
          file: ./sparrow-frigate/Dockerfile.ui
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/criptoworld8484/frigate-umbrel-web:ui-1.5.13
            ghcr.io/criptoworld8484/frigate-umbrel-web:ui-latest
