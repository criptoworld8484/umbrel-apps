name: Publish broadcast-pool-umbrel image

on:
  push:
    branches:
      - master
    paths:
      - "sparrow-broadcast-pool/**"
      - ".github/workflows/publish-broadcast-pool-umbrel.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        run: echo "version=$(grep '^version' sparrow-broadcast-pool/Cargo.toml | head -1 | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./sparrow-broadcast-pool
          file: ./sparrow-broadcast-pool/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          tags: |
            ghcr.io/criptoworld8484/broadcast-pool-umbrel:${{ steps.ver.outputs.version }}-${{ matrix.suffix }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        run: echo "version=$(grep '^version' sparrow-broadcast-pool/Cargo.toml | head -1 | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - run: |
          docker buildx imagetools create \
            -t ghcr.io/criptoworld8484/broadcast-pool-umbrel:${{ steps.ver.outputs.version }} \
            -t ghcr.io/criptoworld8484/broadcast-pool-umbrel:latest \
            ghcr.io/criptoworld8484/broadcast-pool-umbrel:${{ steps.ver.outputs.version }}-amd64 \
            ghcr.io/criptoworld8484/broadcast-pool-umbrel:${{ steps.ver.outputs.version }}-arm64
