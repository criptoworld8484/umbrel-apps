name: Publish broadcast-pool-umbrel image

on:
  push:
    branches:
      - master
    paths:
      - "sparrow-broadcast-pool/**"
      - ".github/workflows/publish-broadcast-pool-umbrel.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        run: echo "version=$(grep '^version' sparrow-broadcast-pool/Cargo.toml | head -1 | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ./sparrow-broadcast-pool
          file: ./sparrow-broadcast-pool/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/criptoworld8484/broadcast-pool-umbrel:${{ steps.ver.outputs.version }}
            ghcr.io/criptoworld8484/broadcast-pool-umbrel:latest
