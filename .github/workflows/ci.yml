name: Validate Umbrel store

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check store manifest
        run: test -f umbrel-app-store.yml && grep -q '^id: "sparrow"' umbrel-app-store.yml

      - name: Validate sparrow-frigate package
        run: bash sparrow-frigate/scripts/validate-package.sh

      - name: Check icon.png exists
        run: test -f sparrow-frigate/icon.png
